plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.carcontroller'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.carcontroller"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

// v2.1：零第三方 UI 依赖。
// 之前 appcompat / material 会在 Manifest 里合并进 androidx.startup.InitializationProvider
// 等 ContentProvider，它们在 Application 启动阶段（早于任何 Activity.onCreate）自动初始化，
// 是开机期崩溃的潜在来源且无法被 Activity 内的崩溃捕获覆盖。这里全部移除。
dependencies {
}
